# Optional: run core (+ Postgres, + Caddy) in containers. boxd still runs on
# each host with Incus (deploy/install.sh or cloud-init), dialing out to core.
#   cd deploy && BOXMES_ADMIN_KEY=... BOXMES_MASTER_KEY=... docker compose up -d
services:
  core:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://boxmes:boxmes@postgres:5432/boxmes?sslmode=disable
      BOXMES_ADDR: ":8080"
      BOXMES_PUBLIC_URL: ${BOXMES_PUBLIC_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      BOXMES_ADMIN_KEY: ${BOXMES_ADMIN_KEY:?set BOXMES_ADMIN_KEY}
      BOXMES_MASTER_KEY: ${BOXMES_MASTER_KEY:?set BOXMES_MASTER_KEY}
      BOXMES_BOOTSTRAP_TOKEN: ${BOXMES_BOOTSTRAP_TOKEN:-}
      # v1.10: origin of the web dashboard, allowed to open terminal / tcp / ssh WebSockets (more: BOXMES_ACCESS_ORIGINS, comma separated)
      BOXMES_DASHBOARD_URL: ${BOXMES_DASHBOARD_URL:-}
      BOXMES_ACCESS_ORIGINS: ${BOXMES_ACCESS_ORIGINS:-}
    volumes: ["core-data:/data"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: boxmes, POSTGRES_PASSWORD: boxmes, POSTGRES_DB: boxmes }
    volumes: ["pg-data:/var/lib/postgresql/data"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      BOXMES_CORE_HOST: ${BOXMES_CORE_HOST:?e.g. core-1-2-3-4.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
volumes: { core-data: {}, pg-data: {}, caddy-data: {} }
