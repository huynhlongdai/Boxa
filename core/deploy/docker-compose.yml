# Optional: run core (+ Postgres, + Caddy) in containers. boxd still runs on
# each host with Incus (deploy/install.sh or cloud-init), dialing out to core.
#   cd deploy && BOXAZ_ADMIN_KEY=... BOXAZ_MASTER_KEY=... docker compose up -d
services:
  core:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://boxaz:boxaz@postgres:5432/boxaz?sslmode=disable
      BOXAZ_ADDR: ":8080"
      BOXAZ_PUBLIC_URL: ${BOXAZ_PUBLIC_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      BOXAZ_ADMIN_KEY: ${BOXAZ_ADMIN_KEY:?set BOXAZ_ADMIN_KEY}
      BOXAZ_MASTER_KEY: ${BOXAZ_MASTER_KEY:?set BOXAZ_MASTER_KEY}
      BOXAZ_BOOTSTRAP_TOKEN: ${BOXAZ_BOOTSTRAP_TOKEN:-}
    volumes: ["core-data:/data"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: boxaz, POSTGRES_PASSWORD: boxaz, POSTGRES_DB: boxaz }
    volumes: ["pg-data:/var/lib/postgresql/data"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      BOXAZ_CORE_HOST: ${BOXAZ_CORE_HOST:?e.g. core-1-2-3-4.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
volumes: { core-data: {}, pg-data: {}, caddy-data: {} }
