[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxmes"
version = "1.1.0"
description = "Python SDK for Boxmes: cheap disposable Linux boxes for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["boxmes", "boxaz", "boxa"]  # boxaz, boxa: deprecated compat shims

[tool.setuptools.package-data]
boxmes = ["py.typed"]
